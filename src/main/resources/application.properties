server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database: H2 file database, hardcoded on purpose (bypasses the Render environment variable).
spring.datasource.url=jdbc:h2:file:/tmp/ukhanyiso/db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql/data.sql are written to work on both H2 and PostgreSQL.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep existing test constraints
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false