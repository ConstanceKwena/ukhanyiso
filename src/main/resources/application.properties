# Hosting: Render provides the port in the PORT variable.
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database: H2 file database by default, PostgreSQL when SPRING_DATASOURCE_URL points at it.
# The Postgres JDBC driver is already on the classpath (pom.xml), so switching is a
# configuration change, not a code change:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/ukhanyiso
#   SPRING_DATASOURCE_USERNAME=ukhanyiso
#   SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/tmp/ukhanyiso/db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# schema.sql/data.sql are written to work on both H2 and PostgreSQL (see their headers).
# Set this to never when pointing at a managed Postgres database that is already initialised,
# so a restart does not re-run the catalogue refresh.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep existing test constraints
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false

# Session cookie flags. Set SESSION_COOKIE_SECURE=true on the HTTPS host.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Password-reset email. Disabled by default: tokens are logged instead (local dev/tests).
# Set MAIL_ENABLED=true plus SMTP details in production.
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@ukhanyiso.org}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Sessions expire after 30 minutes of inactivity.
server.servlet.session.timeout=30m
# Health endpoint for hosting platforms. Only /actuator/health is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true