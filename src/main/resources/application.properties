# Dedicated test configuration: transient in-memory database per test run
spring.datasource.url=jdbc:h2:mem:ukhanyiso_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema and data scripts cleanly on the fresh in-memory DB
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Keep existing test constraints
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false