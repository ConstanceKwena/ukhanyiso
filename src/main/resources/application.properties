server.port=${PORT:8080}
# In-memory H2 database: schema.sql and data.sql are loaded at every startup.
spring.datasource.generate-unique-name=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Security
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Reject JSON with fields we did not ask for (test case S-03)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native
# Keep learners signed in on the same device for 7 days
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d
