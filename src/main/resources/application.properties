server.port=${PORT:8080}

# Persistent H2 database
spring.datasource.url=${DB_URL:jdbc:h2:file:./ukhanyiso-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Do not reload schema.sql/data.sql or drop tables on restart
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Security
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Reject JSON with fields we did not ask for
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=native

# Keep learners signed in on the same device for 7 days
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d