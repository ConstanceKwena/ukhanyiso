<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ukhanyiso: funding</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav aria-label="Main navigation">
    <a href="/index.html">Marks</a>
    <a href="/results.html">Results</a>
    <a href="/funding.html" aria-current="page">Funding</a>
</nav>
<main>
    <header class="page-heading">
        <p class="eyebrow">Plan your applications</p>
        <h1>Funding and documents</h1>
        <p>Use this checklist to keep track of documents commonly needed for bursary applications.</p>
    </header>
    <div id="list"></div>
</main>
<script src="/js/fake-data.js"></script>
<script>
    const list = document.getElementById("list");
    FAKE_BURSARIES.forEach((b, i) => {
        const c = document.createElement("article"); c.className = "card";
        const h = document.createElement("strong"); h.textContent = b.name;
        const p = document.createElement("p"); p.textContent = "Closes " + b.closingDate;
        c.append(h, p);
        b.documents.forEach((doc, j) => {
            const id = `d${i}-${j}`;
            const l = document.createElement("label");
            const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = id; cb.style.width = "auto";
            l.append(cb, " " + doc);
            c.appendChild(l);
        });
        list.appendChild(c);
    });
</script>
</body>
</html>
