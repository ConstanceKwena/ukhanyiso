<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ukhanyiso: log in</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav aria-label="Main navigation">
    <a class="nav-brand" href="/login.html">Ukhanyiso</a>
    <a href="/signup.html">Sign up</a>
    <a href="/login.html" aria-current="page">Log in</a>
</nav>
<main>
    <header class="page-heading">
        <p class="eyebrow">Ukhanyiso account</p>
        <h1>Log in</h1>
        <p>Enter the email and password you used when you signed up. Do not enter an ID or exam number.</p>
    </header>
    <form id="auth-form" data-mode="login" novalidate>
        <div class="field">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" maxlength="100"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password" minlength="12" maxlength="128"
                       autocomplete="current-password" required>
                <button type="button" class="eye-toggle" data-for="password"
                        aria-label="Show password" aria-pressed="false">👁</button>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" id="submit">Log in</button>
        </div>
        <p id="message" class="error" role="alert" aria-live="polite"></p>
        <p class="form-note">Do not enter an ID or exam number.</p>
    </form>
    <p><a class="button-link secondary" href="/signup.html">Need an account? Sign up</a></p>
</main>
<script src="/js/site.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
