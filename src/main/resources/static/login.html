<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ukhanyiso: log in</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav aria-label="Main navigation">
    <a class="nav-brand" href="/login.html">Ukhanyiso</a>
    <a href="/signup.html">Sign up</a>
    <a href="/login.html" aria-current="page">Log in</a>
</nav>
<main>
    <header class="page-heading">
        <p class="eyebrow">Fictional account</p>
        <h1>Log in</h1>
        <p>Enter the fictional username and made-up password you created for this app. Do not enter real or reused credentials.</p>
    </header>
    <form id="auth-form" data-mode="login" novalidate>
        <div class="field">
            <label for="username">Fictional username</label>
            <input id="username" name="username" type="text" minlength="5" maxlength="24"
                   pattern="[A-Za-z0-9_\-]{5,24}" autocomplete="username" autocapitalize="none"
                   spellcheck="false" required>
        </div>
        <div class="field">
            <label for="password">Made-up password</label>
            <input id="password" name="password" type="password" minlength="12" maxlength="128"
                   autocomplete="current-password" required>
        </div>
        <div class="form-actions">
            <button type="submit" id="submit">Log in</button>
        </div>
        <p id="message" class="error" role="alert" aria-live="polite"></p>
        <p class="form-note">No email, phone number, real name, or ID number is used. This account has no password recovery.</p>
    </form>
</main>
<script src="/js/site.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
