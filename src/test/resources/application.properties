# Keep tests isolated from the persistent local-development database.
# A Postgres integration test can override these via SPRING_DATASOURCE_URL etc.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ukhanyiso_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
