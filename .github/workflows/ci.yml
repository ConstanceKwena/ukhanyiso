
name: Ukhanyiso CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Ukhanyiso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Check Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Build and run automated tests
        run: mvn --batch-mode --no-transfer-progress clean verify